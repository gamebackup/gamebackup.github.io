<!DOCTYPE html>
<html>
<head>
    <title>x3e launcher</title>
</head>
<body onload="autoCreate()">
    <script>
        function autoCreate() {
    var url = "https://gamebackup.github.io"; 
    var win = window.open();
   
    if (win) {
        win.document.title = "Google"; 
        
        var link = win.document.createElement('link');
        link.rel = 'icon';
        link.type = 'image/png';
        link.href = 'https://gamebackup.github.io/images/googleiconv2.png'; 
        win.document.getElementsByTagName('head')[0].appendChild(link);
        win.document.body.style.margin = '0';
        win.document.body.style.height = '100vh';
        win.document.body.style.overflow = 'hidden';
        
        var btn = win.document.createElement('button');
        btn.innerHTML = '← Back to x3e';
        btn.style.position = 'fixed';
        btn.style.bottom = '20px';
        btn.style.right = '20px';
        btn.style.zIndex = '9999';
        btn.style.padding = '10px 15px';
        btn.style.backgroundColor = '#800040'; 
        btn.style.color = 'white';
        btn.style.border = 'none';
        btn.style.borderRadius = '5px';
        btn.style.cursor = 'pointer';
        btn.style.fontFamily = 'sans-serif';
        btn.style.opacity = '0.7';
        btn.onmouseover = function() { btn.style.opacity = '1'; };
        btn.onmouseout = function() { btn.style.opacity = '0.7'; };
        
        var iframe = win.document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.style.border = 'none';
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.margin = '0';
        iframe.setAttribute('sandbox', 'allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-scripts allow-same-origin');
        iframe.src = url;
        iframe.id = 'frame';
        btn.onclick = function() {
            iframe.src = url;
        };
        setTimeout(function() {
            iframe.style.display = 'block';
            iframe.style.border = 'none';
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            win.document.body.appendChild(iframe);
        }, 250);
        win.document.body.appendChild(btn);
        setTimeout(function() {
    window.close();
}, 500);
    } else {
        alert("Please allow pop-ups for this file to launch x3e.");
    }
}
    </script>
    <p>Launching x3e unblocked games... if it doesn't open, ensure pop-ups are enabled.</p>
</body>
</html>
