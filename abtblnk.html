<!DOCTYPE html>
<html>
<head>
    <title>x3e unblocked games</title>
</head>
<body onload="autoCreate()">
    <script>
        function autoCreate() {
            var url = "https://gamebackup.github.io"; 
            
            var win = window.open();
            
            if (win) {
                win.document.body.style.margin = '0';
                win.document.body.style.height = '100vh';
                
                var iframe = win.document.createElement('iframe');
                iframe.style.border = 'none';
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.style.margin = '0';
                iframe.src = url;
                
                win.document.body.appendChild(iframe);
                
                window.close();
            } else {
                alert("Please allow pop-ups for this file to launch the games.");
            }
        }
    </script>
    <p>Launching x3e unblocked games... if it doesn't open, ensure pop-ups are enabled.</p>
</body>
</html>
