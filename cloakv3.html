<!DOCTYPE html>
<html>
<head>
    <title>x3e launcher</title>
</head>
<body onload="autoCreate()">
    <script>
        function autoCreate() {
            var url = "https://gamebackup.github.io"; 
            var win = window.open();
           
            if (win) {
                var doc = win.document;
                doc.title = "Google"; 
                
                var link = doc.createElement('link');
                link.rel = 'icon';
                link.type = 'image/png';
                link.href = 'https://gamebackup.github.io/images/googleiconv2.png'; 
                doc.head.appendChild(link);
                
                doc.body.style.margin = '0';
                doc.body.style.height = '100vh';
                doc.body.style.overflow = 'hidden';
                doc.body.style.backgroundColor = "black";

                var iframe = doc.createElement('iframe');
                iframe.id = 'frame';
                iframe.style.display = 'none';
                iframe.style.border = 'none';
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.setAttribute('sandbox', 'allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-scripts allow-same-origin');
                iframe.src = url;

                var btn = doc.createElement('button');
                btn.innerHTML = '← Back to x3e';
                btn.style.cssText = "position:fixed; bottom:20px; right:20px; z-index:99999; padding:10px 15px; background-color:#800040; color:white; border:2px solid white; border-radius:5px; cursor:pointer; font-family:sans-serif; opacity:0.7;";
                
                btn.onmouseover = function() { btn.style.opacity = '1'; };
                btn.onmouseout = function() { btn.style.opacity = '0.7'; };
                
                btn.onclick = function() {
                    doc.getElementById('frame').src = url;
                };
                setTimeout(function() {
                    doc.body.appendChild(iframe);
                    doc.body.appendChild(btn); 
                    iframe.style.display = 'block';
                }, 250);
                setTimeout(function() {
                    window.close();
                }, 500);

            } else {
                alert("Please allow pop-ups to launch x3e.");
            }
        }
    </script>
    <p>Launching x3e unblocked games... if it doesn't open, ensure pop-ups are enabled.</p>
</body>
</html>
